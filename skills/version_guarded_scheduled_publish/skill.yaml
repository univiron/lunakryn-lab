  needs_review: false
  rationale: 'The 2026-10-29 publish job for the Forgotten Agent essay was booked without a VERSION tick even though the same guard had already stranded essay 15, and the missing bump was flagged before the deadline, fixed by a user-approved job update verified by read-back, and then pushed first try as VERSION 0.4.5 to 0.4.6 in commit 5f26a3b with tag v0.4.6. A scheduled push that fails does not retry, so catching the omission at authoring time matters more than catching it before the deadline. No existing skill covers this guard check: skill_search for version guard publishing returned only social_publishing and unrelated skills. The deterministic repeated-handoff-suppression candidates were rejected because they concern objective idle behavior and system trigger policy, which this loop does not change, and the 16 terminal tool failures share no shape or detail that would support a skill. This single skill moves the bump, the VERSION commit, the tag, and the pre-fire read-back into the job definition itself, scoped to Luna repos only with no major or 1.x path.'
