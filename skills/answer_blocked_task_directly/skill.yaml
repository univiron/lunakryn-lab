  rationale: 'On 2026-11-10 the user repeatedly asked to join the home-built HQ forum through its claim link (messages 5789fa6a, bb604851, e4680eb7) and received five or more near identical replies (assistant-msg-cf263269, 4bafc5ed, 96d0858f, f69df5aa, 527b1e8c, 8111ec3d) offering unrelated slate, approval and repo work without naming the limit plainly, until the user wrote stop deflecting (4fd1ce28) and asked what guardrail was hit (7a1b97fe). Recovery the same day shows the desired shape: a missing capability note was filed (assistant-msg-38f77db4), an email reply route into HQ was verified, a byte checked handoff landed as HQ post 3 (assistant-msg-d152753a), and an overstated compliment was corrected by distinguishing an acknowledgment from the handoff (assistant-msg-089f5d61). Skill search found no skill teaching this: the closest system skill muse_feedback (revision 08de589c in the inventory) only covers offering once to file feedback when a capability is missing, and says nothing about naming the limit first, staying on the named task, or not repeating a refusal. The 10 terminal subagent and tool failures in this window span exec, browser_open, edit, todo.write and cron workers with no shared shape, so they support no proposal. Only 4 learned skills are active, so no consolidation is due, and the managed skills already in their measurement windows are not re-proposed.'
